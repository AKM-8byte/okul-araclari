<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LGS / YKS Puan Hesaplayıcı · Okul Araçları</title>
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#ea580c">
<link rel="icon" href="../assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/common.js"></script>
<style>
  .page{max-width:1080px}
  .tabsbar{display:flex;justify-content:center;margin-bottom:18px}
  .tabsbar .seg button{padding:9px 18px;font-size:15px}
  .layout{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
  .layout > *{min-width:0}
  .tbl td,.tbl th{text-align:center}
  .tbl td:first-child,.tbl th:first-child{text-align:left}
  .tbl .input{width:70px;text-align:center;font-weight:900;padding:6px}
  .tbl .input.err{border-color:var(--bad);background:var(--bad-soft)}
  .tbl td.net{font-weight:900;font-size:16px;color:var(--brand)}
  .tbl td.bos{color:var(--muted);font-weight:800}
  .tbl tfoot td{font-weight:900;border-top:1.5px solid var(--line);padding-top:10px}
  .dname{font-weight:800}
  .dname small{display:block;color:var(--muted);font-weight:700;font-size:12px}
  .result{position:sticky;top:76px;text-align:center}
  .big{font-size:52px;font-weight:900;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:8px 0}
  .rlabel{font-weight:800;color:var(--muted)}
  .rrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-2);font-weight:800}
  .rrow b{font-weight:900}
  .meter{height:12px;border-radius:6px;background:var(--line-2);overflow:hidden;margin:6px 0 14px}
  .meter i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width .3s}
  .warnbox{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:14px;font-weight:600;text-align:left}
  .obp{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;font-weight:800}
  .obp .input{width:90px;text-align:center;font-weight:900}
  @media (max-width:860px){.layout{grid-template-columns:1fr}.result{position:static}}
</style>
</head>
<body>
<div class="page">
  <div class="tabsbar"><div class="seg" id="tabs">
    <button data-tab="lgs">🎒 LGS</button><button data-tab="tyt">📗 YKS · TYT</button><button data-tab="ayt">📘 YKS · AYT</button>
  </div></div>
  <div class="layout">
    <div class="panel">
      <h2 id="title"></h2>
      <div class="seg" id="alanSeg" style="margin-bottom:12px;display:none">
        <button data-alan="say">Sayısal</button><button data-alan="ea">Eşit Ağırlık</button><button data-alan="soz">Sözel</button><button data-alan="dil">Dil</button>
      </div>
      <div style="overflow-x:auto"><table class="tbl" id="tbl"></table></div>
      <div class="row" style="margin-top:12px"><button class="btn sm danger" id="btnClear">Bu sınavı temizle</button></div>
      <div class="obp" id="obpBox"><span>🎓 Diploma notu</span><input class="input" type="number" min="50" max="100" step="0.01" id="dip" placeholder="ör. 85"><span class="small">OBP katkısı yerleştirme puanına eklenir.</span></div>
    </div>
    <div class="panel result" id="result"></div>
  </div>
</div>

<script>
OA.topbar({
  emoji: '🎯', title: 'LGS / YKS Puan Hesaplayıcı',
  help: {
    key: 'sinav-puan', emoji: '🎯', title: 'Bu bir LGS / YKS net ve puan hesaplayıcısıdır',
    intro: 'Deneme ya da sınav sonrası netlerinizi ve tahmini puanınızı hesaplar. Şu şekilde kullanılır:',
    steps: [
      { icon: '📑', title: 'Sınavı seçin', text: 'Üstten LGS, TYT ya da AYT sekmesini seçin. AYT için puan türünüzü (Sayısal, EA, Sözel, Dil) seçin.' },
      { icon: '✍️', title: 'Doğru ve yanlışları girin', text: 'Her ders için doğru ve yanlış sayısını yazın; boş ve net kendiliğinden hesaplanır.' },
      { icon: '🎓', title: 'Diploma notunu ekleyin', text: 'YKS için diploma notunuzu yazarsanız OBP katkısı yerleştirme puanına eklenir.' },
      { icon: '⚠️', title: 'Tahmini olduğunu unutmayın', text: 'Gerçek puan, o yılki sınava girenlerin ortalamasına göre değişir. Bu araç yaklaşık bir sonuç verir.' }
    ]
  }
});

const KEY = 'oa.sinavPuan';
const $ = s => document.querySelector(s);
// [anahtar, ad, soru sayısı, katsayı]
const EXAMS = {
  lgs: { title: '🎒 LGS (8. sınıf)', wrong: 3, rows: [['tr', 'Türkçe', 20, 4], ['ink', 'T.C. İnkılap Tarihi', 10, 1], ['din', 'Din Kültürü', 10, 1], ['ing', 'Yabancı Dil', 10, 1], ['mat', 'Matematik', 20, 4], ['fen', 'Fen Bilimleri', 20, 4]] },
  tyt: { title: '📗 TYT (Temel Yeterlilik Testi)', wrong: 4, rows: [['tr', 'Türkçe', 40, 3.3], ['sos', 'Sosyal Bilimler', 20, 3.4], ['mat', 'Temel Matematik', 40, 3.3], ['fen', 'Fen Bilimleri', 20, 3.4]] },
  say: { title: '📘 AYT · Sayısal', wrong: 4, rows: [['mat', 'Matematik', 40, 5], ['fiz', 'Fizik', 14, 5], ['kim', 'Kimya', 13, 5], ['bio', 'Biyoloji', 13, 5]] },
  ea: { title: '📘 AYT · Eşit Ağırlık', wrong: 4, rows: [['mat', 'Matematik', 40, 5], ['edb', 'Türk Dili ve Edebiyatı', 24, 5], ['tar1', 'Tarih-1', 10, 5], ['cog1', 'Coğrafya-1', 6, 5]] },
  soz: { title: '📘 AYT · Sözel', wrong: 4, rows: [['edb', 'Türk Dili ve Edebiyatı', 24, 5], ['tar1', 'Tarih-1', 10, 5], ['cog1', 'Coğrafya-1', 6, 5], ['tar2', 'Tarih-2', 11, 5], ['cog2', 'Coğrafya-2', 11, 5], ['fel', 'Felsefe Grubu', 12, 5], ['din', 'Din Kültürü', 6, 5]] },
  dil: { title: '📘 YDT · Yabancı Dil', wrong: 4, rows: [['ydt', 'Yabancı Dil Testi', 80, 5]] }
};
let S = { tab: 'lgs', alan: 'say', dip: '', v: {}, ...OA.store.get(KEY, {}) };
const save = () => OA.store.set(KEY, S);
const examKey = () => S.tab === 'ayt' ? S.alan : S.tab;
const val = (ek, k, f) => +(S.v[ek]?.[k]?.[f] || 0);

function nets(ek) {
  const E = EXAMS[ek];
  return E.rows.map(([k, , q, w]) => {
    const d = val(ek, k, 'd'), y = val(ek, k, 'y');
    return { k, q, w, d, y, ok: d + y <= q, net: Math.max(0, d - y / E.wrong) };
  });
}
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
// Tahmini puanlar: sabit katsayılı yaklaşık formüller (ÖSYM/MEB her yıl standart sapmaya göre hesaplar)
function score(ek) {
  const n = nets(ek);
  if (ek === 'lgs') return 194.75 + sum(n, x => x.net * x.w) * (305.25 / 270);
  return 100 + sum(n, x => x.net * x.w);
}
const obp = () => { const d = +S.dip; return d >= 50 && d <= 100 ? d * 5 * 0.12 : 0; };
const f2 = v => OA.fmt(v, 2);

function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  document.querySelectorAll('#alanSeg button').forEach(b => b.classList.toggle('on', b.dataset.alan === S.alan));
  $('#alanSeg').style.display = S.tab === 'ayt' ? '' : 'none';
  $('#obpBox').style.display = S.tab === 'lgs' ? 'none' : '';
  $('#dip').value = S.dip;
  const ek = examKey(), E = EXAMS[ek];
  $('#title').innerHTML = `<span><span class="h-ic">📝</span> ${E.title}</span><span class="small">Yanlış/${E.wrong} doğruyu götürür</span>`;
  const n = nets(ek);
  $('#tbl').innerHTML = `
    <thead><tr><th>Ders</th><th>Doğru</th><th>Yanlış</th><th>Boş</th><th>Net</th></tr></thead>
    <tbody>${E.rows.map(([k, name, q], i) => `<tr>
      <td class="dname">${name}<small>${q} soru</small></td>
      <td><input class="input ${n[i].ok ? '' : 'err'}" type="number" min="0" max="${q}" data-k="${k}" data-f="d" value="${S.v[ek]?.[k]?.d ?? ''}"></td>
      <td><input class="input ${n[i].ok ? '' : 'err'}" type="number" min="0" max="${q}" data-k="${k}" data-f="y" value="${S.v[ek]?.[k]?.y ?? ''}"></td>
      <td class="bos" data-bos="${k}"></td><td class="net" data-net="${k}"></td></tr>`).join('')}
    </tbody>
    <tfoot><tr><td>Toplam</td><td id="tD"></td><td id="tY"></td><td id="tB"></td><td id="tN" class="net"></td></tr></tfoot>`;
  calc();
}

function calc() {
  const ek = examKey(), n = nets(ek);
  for (const x of n) {
    document.querySelector(`[data-bos="${x.k}"]`).textContent = x.ok ? x.q - x.d - x.y : '⚠️';
    document.querySelector(`[data-net="${x.k}"]`).textContent = f2(x.net);
    document.querySelectorAll(`input[data-k="${x.k}"]`).forEach(i => i.classList.toggle('err', !x.ok));
  }
  $('#tD').textContent = sum(n, x => x.d); $('#tY').textContent = sum(n, x => x.y);
  $('#tB').textContent = sum(n, x => Math.max(0, x.q - x.d - x.y)); $('#tN').textContent = f2(sum(n, x => x.net));
  const bad = n.some(x => !x.ok);
  let html;
  if (S.tab === 'lgs') {
    const p = score('lgs');
    html = `<h2 style="justify-content:center">Tahmini LGS puanı</h2><div class="big">${bad ? '—' : f2(p)}</div><div class="rlabel">500 üzerinden</div>
      <div class="meter"><i style="width:${(p - 100) / 4}%"></i></div>
      <div class="rrow"><span>Toplam net</span><b>${f2(sum(n, x => x.net))} / 90</b></div>
      <div class="rrow"><span>Ağırlıklı net</span><b>${f2(sum(n, x => x.net * x.w))} / 270</b></div>`;
  } else {
    const tyt = score('tyt'), tytNet = sum(nets('tyt'), x => x.net), o = obp();
    html = `<h2 style="justify-content:center">${S.tab === 'tyt' ? 'Tahmini TYT puanı' : `Tahmini ${{ say: 'SAY', ea: 'EA', soz: 'SÖZ', dil: 'DİL' }[S.alan]} puanı`}</h2>`;
    if (S.tab === 'tyt') {
      html += `<div class="big">${bad ? '—' : f2(tyt)}</div><div class="rlabel">Ham puan (500 üzerinden)</div>
        <div class="meter"><i style="width:${(tyt - 100) / 4}%"></i></div>
        <div class="rrow"><span>TYT net</span><b>${f2(tytNet)} / 120</b></div>
        <div class="rrow"><span>OBP katkısı</span><b>${o ? '+' + f2(o) : '—'}</b></div>
        <div class="rrow"><span>Yerleştirme puanı</span><b>${f2(tyt + o)}</b></div>`;
    } else {
      const ayt = score(ek), yer = 0.4 * tyt + 0.6 * ayt;
      html += `<div class="big">${bad ? '—' : f2(yer + o)}</div><div class="rlabel">Yerleştirme puanı (OBP dahil)</div>
        <div class="meter"><i style="width:${(yer - 100) / 4}%"></i></div>
        <div class="rrow"><span>AYT net</span><b>${f2(sum(n, x => x.net))} / 80</b></div>
        <div class="rrow"><span>TYT net <small class="muted">(TYT sekmesinden)</small></span><b>${f2(tytNet)}</b></div>
        <div class="rrow"><span>Ham puan</span><b>${f2(yer)}</b></div>
        <div class="rrow"><span>OBP katkısı</span><b>${o ? '+' + f2(o) : '—'}</b></div>`;
    }
  }
  if (bad) html += '<div class="warnbox" style="color:var(--bad)">⚠️ Bir derste doğru + yanlış, soru sayısından fazla.</div>';
  html += `<div class="warnbox">ℹ️ Bu puan <b>tahminidir</b>. Gerçek puan, o yıl sınava girenlerin ortalama ve standart sapmasına göre hesaplanır; birkaç puan farklı çıkabilir.</div>`;
  $('#result').innerHTML = html;
}

$('#tbl').addEventListener('input', e => {
  const t = e.target; if (!t.dataset.k) return;
  const ek = examKey();
  S.v[ek] = S.v[ek] || {}; S.v[ek][t.dataset.k] = S.v[ek][t.dataset.k] || {};
  S.v[ek][t.dataset.k][t.dataset.f] = t.value === '' ? '' : Math.max(0, +t.value);
  save(); calc();
});
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.tab = b.dataset.tab; save(); render(); } });
$('#alanSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.alan = b.dataset.alan; save(); render(); } });
$('#dip').addEventListener('input', e => { S.dip = e.target.value; save(); calc(); });
$('#btnClear').onclick = () => { if (confirm('Bu sınavdaki tüm değerler silinsin mi?')) { delete S.v[examKey()]; save(); render(); } };
render();
</script>
</body>
</html>
