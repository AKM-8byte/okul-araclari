<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yoklama Çizelgesi · Okul Araçları</title>
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#ea580c">
<link rel="icon" href="../assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/common.js"></script>
<script src="../assets/vendor/xlsx.full.min.js"></script>
<style>
  .controls{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
  .controls .field{min-width:200px}
  .month{display:flex;align-items:center;gap:6px}
  .month b{min-width:150px;text-align:center;font-size:18px;font-weight:900}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
  .stat{display:flex;gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 4px 0 var(--pop)}
  .stat .si{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--brand-soft);flex:none}
  .stat b{display:block;font-size:22px;font-weight:900;line-height:1.1}
  .stat span{font-size:12.5px;color:var(--muted);font-weight:800}
  .brushbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}

  .gridwrap{overflow:auto;max-height:66vh;border:1.5px solid var(--line-2);border-radius:14px}
  table.yk{border-collapse:separate;border-spacing:0;min-width:100%;user-select:none}
  .yk th,.yk td{border-bottom:1px solid var(--line-2);text-align:center;padding:0;white-space:nowrap}
  .yk thead th{position:sticky;top:0;z-index:2;background:var(--surface);font-size:11.5px;color:var(--muted);padding:6px 2px;border-bottom:1.5px solid var(--line);cursor:pointer}
  .yk thead th b{display:block;font-size:14px;color:var(--text)}
  .yk thead th.today{background:var(--brand-soft)}
  .yk thead th.today b{color:var(--brand)}
  .yk thead th.hol{background:repeating-linear-gradient(45deg,var(--line-2) 0 5px,var(--surface) 5px 10px)}
  .yk .nm{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:6px 10px;font-weight:800;min-width:200px;cursor:default}
  .yk thead .nm{z-index:3}
  .yk .nm small{color:var(--muted);font-weight:700;margin-right:6px}
  .yk td.c{width:34px;min-width:34px;height:34px;cursor:pointer;font-weight:900;font-size:15px}
  .yk td.c:hover{outline:2px solid var(--brand);outline-offset:-2px}
  .yk td.c.today{background:color-mix(in srgb,var(--brand-soft) 50%,transparent)}
  .yk td.c.hol{background:repeating-linear-gradient(45deg,var(--line-2) 0 5px,transparent 5px 10px);cursor:not-allowed}
  .yk td.c.wk{border-left:2px solid var(--line)}
  .m-v{color:var(--ok)} .m-y{color:#fff;background:var(--bad)!important;border-radius:8px} .m-i{color:#fff;background:var(--info)!important;border-radius:8px} .m-g{color:#fff;background:var(--warn)!important;border-radius:8px}
  .yk td.t{font-weight:900;min-width:52px;padding:0 6px}
  .yk td.t.warn{color:var(--warn)} .yk td.t.bad{color:#fff;background:var(--bad);border-radius:8px}
  .yk tfoot td{position:sticky;bottom:0;background:var(--brand-soft);font-weight:900;font-size:12px;color:var(--brand-ink);padding:6px 2px}
  .yk tfoot .nm{background:var(--brand-soft)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;font-weight:800;color:var(--muted);margin-top:10px}
  .legend i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-style:normal;margin-right:4px}
  .empty{text-align:center;padding:50px 16px;color:var(--muted);font-weight:700}
  .empty .big{font-size:46px}

  /* Kâğıt */
  .p-head{text-align:center;margin-bottom:10px}
  .p-head .o{font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#555;font-size:12px}
  .p-head h1{margin:2px 0 4px;font-size:19px}
  .p-meta{display:flex;justify-content:center;gap:16px;font-size:12px;flex-wrap:wrap}
  .p-tbl{width:100%;border-collapse:collapse;font-size:10.5px;table-layout:fixed}
  .p-tbl th,.p-tbl td{border:1px solid #888;padding:2px 1px;text-align:center;overflow:hidden}
  .p-tbl th{background:#f0f0f0}
  .p-tbl td.n{text-align:left;padding-left:4px;white-space:nowrap}
  .p-tbl td.h,.p-tbl th.h{background:#e6e6e6}
  .p-tbl td.y{font-weight:900}
  .p-legend{margin-top:8px;font-size:11px}
  .p-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-top:6px;break-inside:avoid}
  .p-sign div{text-align:center;min-width:200px;font-size:12px;font-weight:700}
  .p-sign .ln{border-bottom:1px dotted #444;height:26px;margin-bottom:3px}
</style>
</head>
<body>
<div class="page">
  <div class="controls">
    <label class="field">Sınıf<select class="input" id="cls"></select></label>
    <div class="field">Ay<div class="month"><button class="btn sm" id="prev">‹</button><b id="mlabel"></b><button class="btn sm" id="next">›</button></div></div>
    <div class="checks" style="align-self:center"><label><input type="checkbox" id="sat"> Cumartesi de var</label></div>
    <span class="spacer"></span>
    <button class="btn" id="btnExport">📥 Excel</button>
    <button class="btn" id="btnPrintSet">🖨️ Yazdır</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="panel">
    <div class="brushbar">
      <span class="small" style="font-weight:800">Tıklayınca:</span>
      <div class="seg" id="brush">
        <button data-b="cycle">🔁 Sırayla değiştir</button><button data-b="v">✓ Var</button><button data-b="y">✗ Yok</button><button data-b="i">İ İzinli</button><button data-b="g">G Geç</button><button data-b="">🧽 Sil</button>
      </div>
      <span class="spacer"></span>
      <button class="btn sm primary" id="btnToday">✓ Bugün işaretlenmeyenler "var"</button>
    </div>
    <div class="gridwrap" id="gridwrap"></div>
    <div class="legend">
      <span><i class="m-v" style="border:1.5px solid var(--line)">✓</i>Var</span>
      <span><i class="m-y">✗</i>Yok (özürsüz)</span>
      <span><i class="m-i">İ</i>İzinli (özürlü)</span>
      <span><i class="m-g">G</i>Geç</span>
      <span>Gün başlığına tıklayınca o gün <b>tatil</b> olarak işaretlenir.</span>
    </div>
  </div>

  <div class="panel" style="margin-top:16px">
    <h2><span><span class="h-ic">⚙️</span> Ayarlar</span></h2>
    <div class="grid3">
      <label class="field">Özürsüz devamsızlık sınırı (gün)<input class="input" type="number" min="1" max="60" data-k="limitY"></label>
      <label class="field">Toplam devamsızlık sınırı (gün)<input class="input" type="number" min="1" max="90" data-k="limitT"></label>
      <label class="field">Okul adı (çıktı için)<input class="input" data-k="okul"></label>
      <label class="field">Sınıf öğretmeni (çıktı için)<input class="input" data-k="ogretmen"></label>
    </div>
    <p class="small" style="margin:10px 0 0">Toplamlar bu sınıf için kayıtlı tüm ayları kapsar. Geç kalmalar devamsızlığa sayılmaz, ayrıca gösterilir.</p>
  </div>
</div>

<script>
OA.topbar({
  emoji: '📋', title: 'Yoklama Çizelgesi',
  help: {
    key: 'yoklama', emoji: '📋', title: 'Bu bir yoklama çizelgesidir',
    intro: 'Sınıfınızın günlük yoklamasını tutar, devamsızlıkları sayar ve aylık çizelge yazdırır. Şu şekilde kullanılır:',
    steps: [
      { icon: '🏫', title: 'Sınıfı ve ayı seçin', text: 'Sınıflarım\'daki bir sınıfı seçin; ok düğmeleriyle aylar arasında gezin.' },
      { icon: '✅', title: 'Yoklamayı alın', text: '"Bugün işaretlenmeyenler var" ile herkesi geldi sayın, sonra gelmeyenlerin kutusuna tıklayın. Kutuya her tıklama Var → Yok → İzinli → Geç sırasıyla değişir.' },
      { icon: '🖌️', title: 'Hızlı işaretleme', text: 'Üstten "Yok" gibi bir işaret seçerseniz tıkladığınız her kutuya doğrudan o işaret konur.' },
      { icon: '🏖️', title: 'Tatilleri işaretleyin', text: 'Gün başlığına tıklayınca o gün tatil olur ve sayılmaz.' },
      { icon: '⚠️', title: 'Sınırı takip edin', text: 'Devamsızlığı sınıra yaklaşan öğrenci sarı, aşan kırmızı görünür. Aylık çizelgeyi yazdırabilir ya da Excel\'e aktarabilirsiniz.' }
    ]
  }
});

const KEY = 'oa.yoklama';
const $ = s => document.querySelector(s);
const esc = OA.esc;
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const TODAY = iso(new Date());
const MONTHS = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
const WD = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
const SYM = { v: '✓', y: '✗', i: 'İ', g: 'G' };
const CYCLE = ['', 'v', 'y', 'i', 'g'];
let S = {
  classId: OA.classes.active()?.id || '', ym: TODAY.slice(0, 7), sat: false, brush: 'cycle', limitY: 10, limitT: 30, okul: '', ogretmen: '',
  holidays: {}, rec: {}, printBlank: false,
  ...OA.store.get(KEY, {})
};
const save = () => OA.store.set(KEY, S);
const cls = () => OA.classes.get(S.classId);
const rec = () => (S.rec[S.classId] = S.rec[S.classId] || {});

function days() {
  const [y, m] = S.ym.split('-').map(Number), out = [];
  for (let d = new Date(y, m - 1, 1); d.getMonth() === m - 1; d.setDate(d.getDate() + 1)) {
    const wd = d.getDay();
    if (wd >= 1 && wd <= (S.sat ? 6 : 5)) out.push({ iso: iso(d), day: d.getDate(), wd });
  }
  return out;
}
// Bir öğrencinin verilen günlerdeki (verilmezse tüm kayıtlardaki) sayıları
function tally(sid, onlyDays) {
  const r = rec(), t = { y: 0, i: 0, g: 0 };
  const dates = onlyDays ? onlyDays.map(d => d.iso) : Object.keys(r);
  for (const dt of dates) { if (S.holidays[dt]) continue; const m = r[dt]?.[sid]; if (t[m] != null) t[m]++; }
  return t;
}
const level = (n, lim) => n >= lim ? 'bad' : n >= lim - 2 ? 'warn' : '';

function render() {
  if (!OA.classes.list().length) S.classId = '';
  else if (!cls()) S.classId = OA.classes.active()?.id;
  OA.fillClassSelect($('#cls'), S.classId);
  const [y, m] = S.ym.split('-').map(Number);
  $('#mlabel').textContent = `${MONTHS[m - 1]} ${y}`;
  $('#sat').checked = S.sat;
  document.querySelectorAll('#brush button').forEach(b => b.classList.toggle('on', b.dataset.b === S.brush));
  document.querySelectorAll('[data-k]').forEach(el => { if (document.activeElement !== el) el.value = S[el.dataset.k]; });
  const c = cls();
  if (!c || !c.students.length) {
    $('#gridwrap').innerHTML = `<div class="empty"><div class="big">📋</div>${c ? 'Bu sınıfta öğrenci yok.' : 'Önce Sınıflarım sayfasından bir sınıf oluşturun.'}<br><br><a class="btn primary" href="siniflar.html">📚 Sınıflarım</a></div>`;
    $('#stats').innerHTML = ''; return;
  }
  const D = days(), r = rec();
  const studs = [...c.students].sort((a, b) => (+a.no || 1e9) - (+b.no || 1e9));
  let html = `<table class="yk"><thead><tr><th class="nm">Öğrenci</th>${D.map((d, i) => `
    <th data-day="${d.iso}" class="${d.iso === TODAY ? 'today' : ''} ${S.holidays[d.iso] ? 'hol' : ''}" title="${S.holidays[d.iso] ? 'Tatil — kaldırmak için tıklayın' : 'Tatil yapmak için tıklayın'}"><b>${d.day}</b>${WD[d.wd]}</th>`).join('')}
    <th title="Bu ay özürsüz">Yok</th><th title="Bu ay özürlü">İzin</th><th title="Bu ay geç">Geç</th><th title="Tüm kayıtlar: özürsüz / toplam">Toplam</th></tr></thead><tbody>`;
  for (const s of studs) {
    const mt = tally(s.id, D), at = tally(s.id);
    const tot = at.y + at.i, lv = level(at.y, S.limitY) || level(tot, S.limitT);
    html += `<tr><td class="nm"><small>${esc(s.no)}</small>${esc(s.name)}</td>${D.map((d, i) => {
      const mk = r[d.iso]?.[s.id] || '', hol = S.holidays[d.iso];
      return `<td class="c ${d.iso === TODAY ? 'today' : ''} ${hol ? 'hol' : ''} ${i && d.wd === 1 ? 'wk' : ''}" data-d="${d.iso}" data-s="${s.id}"><span class="m-${mk}">${hol ? '' : SYM[mk] || ''}</span></td>`;
    }).join('')}
    <td class="t">${mt.y || ''}</td><td class="t">${mt.i || ''}</td><td class="t">${mt.g || ''}</td>
    <td class="t ${lv}" title="Özürsüz ${at.y} gün, toplam ${tot} gün">${at.y} / ${tot}</td></tr>`;
  }
  html += `</tbody><tfoot><tr><td class="nm">Gelmeyen</td>${D.map(d => {
    const n = S.holidays[d.iso] ? '' : studs.filter(s => ['y', 'i'].includes(r[d.iso]?.[s.id])).length;
    return `<td>${n || ''}</td>`;
  }).join('')}<td colspan="4"></td></tr></tfoot></table>`;
  $('#gridwrap').innerHTML = html;
  // m-v için arka plan gerekmiyor; diğer işaretler hücreyi doldursun
  document.querySelectorAll('.yk td.c span').forEach(sp => { if (/m-[yig]/.test(sp.className)) sp.parentElement.classList.add(sp.className); });

  const todayAbs = studs.filter(s => ['y', 'i'].includes(r[TODAY]?.[s.id])).length;
  const marked = studs.filter(s => r[TODAY]?.[s.id]).length;
  const monthTot = studs.reduce((n, s) => { const t = tally(s.id, D); return n + t.y + t.i; }, 0);
  const risky = studs.filter(s => { const t = tally(s.id); return level(t.y, S.limitY) || level(t.y + t.i, S.limitT); });
  $('#stats').innerHTML = `
    <div class="stat"><span class="si">👥</span><div><b>${studs.length}</b><span>Öğrenci</span></div></div>
    <div class="stat"><span class="si">📅</span><div><b>${marked ? todayAbs : '—'}</b><span>Bugün gelmeyen${marked < studs.length ? ` (${studs.length - marked} işaretsiz)` : ''}</span></div></div>
    <div class="stat"><span class="si">🗓️</span><div><b>${monthTot}</b><span>Bu ay toplam devamsızlık (gün)</span></div></div>
    <div class="stat"><span class="si">⚠️</span><div><b style="color:${risky.length ? 'var(--bad)' : 'var(--ok)'}">${risky.length}</b><span>${risky.length ? 'Sınıra yaklaşan / aşan: ' + risky.slice(0, 3).map(s => esc(s.name.split(' ')[0])).join(', ') + (risky.length > 3 ? '…' : '') : 'Sınıra yaklaşan yok'}</span></div></div>`;
}

// ---------- İşaretleme ----------
let dragging = false;
function mark(td) {
  if (!td?.dataset.d || S.holidays[td.dataset.d]) return;
  const r = rec(), d = td.dataset.d, sid = td.dataset.s;
  r[d] = r[d] || {};
  const cur = r[d][sid] || '';
  const nxt = S.brush === 'cycle' ? CYCLE[(CYCLE.indexOf(cur) + 1) % CYCLE.length] : S.brush;
  if (nxt) r[d][sid] = nxt; else delete r[d][sid];
  td.className = td.className.replace(/\bm-[vyig]\b/g, '').trim();
  td.innerHTML = `<span class="m-${nxt}">${SYM[nxt] || ''}</span>`;
  if (/[yig]/.test(nxt)) td.classList.add('m-' + nxt);
}
const gw = $('#gridwrap');
gw.addEventListener('mousedown', e => {
  const td = e.target.closest('td.c'); if (!td) return;
  e.preventDefault(); dragging = S.brush !== 'cycle'; mark(td);
  if (!dragging) { save(); render(); }
});
gw.addEventListener('mouseover', e => { if (dragging) mark(e.target.closest('td.c')); });
document.addEventListener('mouseup', () => { if (dragging) { dragging = false; save(); render(); } });
gw.addEventListener('click', e => {
  const th = e.target.closest('th[data-day]'); if (!th) return;
  const d = th.dataset.day;
  S.holidays[d] ? delete S.holidays[d] : (S.holidays[d] = 1);
  save(); render();
});

$('#btnToday').onclick = () => {
  const c = cls(); if (!c) return;
  if (!days().some(d => d.iso === TODAY)) return OA.toast('Bugün seçili ayda değil ya da okul günü değil');
  if (S.holidays[TODAY]) return OA.toast('Bugün tatil olarak işaretli');
  const r = rec(); r[TODAY] = r[TODAY] || {};
  let n = 0;
  for (const s of c.students) if (!r[TODAY][s.id]) { r[TODAY][s.id] = 'v'; n++; }
  save(); render(); OA.toast(`${n} öğrenci "var" olarak işaretlendi`);
};
$('#cls').addEventListener('change', e => { if (e.target.value === '__manage') return; S.classId = e.target.value; OA.classes.setActive(S.classId); save(); render(); });
const shiftMonth = k => { const [y, m] = S.ym.split('-').map(Number); const d = new Date(y, m - 1 + k, 1); S.ym = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; save(); render(); };
$('#prev').onclick = () => shiftMonth(-1);
$('#next').onclick = () => shiftMonth(1);
$('#sat').onchange = e => { S.sat = e.target.checked; save(); render(); };
$('#brush').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.brush = b.dataset.b; save(); render(); } });
document.querySelectorAll('[data-k]').forEach(el => el.addEventListener('input', () => {
  S[el.dataset.k] = el.type === 'number' ? Math.max(1, +el.value || 1) : el.value; save();
  if (el.type === 'number') render();
}));

// ---------- Excel ve yazdırma ----------
function sheetRows(blank) {
  const c = cls(), D = days(), r = rec();
  const studs = [...c.students].sort((a, b) => (+a.no || 1e9) - (+b.no || 1e9));
  return { D, studs, cell: (d, s) => S.holidays[d.iso] ? '' : blank ? '' : SYM[r[d.iso]?.[s.id]] || '' };
}
$('#btnExport').onclick = () => {
  if (typeof XLSX === 'undefined') return OA.toast('Excel aracı yüklenemedi, internet bağlantınızı kontrol edin');
  if (!cls()?.students.length) return OA.toast('Önce sınıf seçin');
  const { D, studs, cell } = sheetRows(false);
  const aoa = [['No', 'Ad Soyad', ...D.map(d => `${d.day} ${WD[d.wd]}${S.holidays[d.iso] ? ' (tatil)' : ''}`), 'Yok', 'İzinli', 'Geç']];
  for (const s of studs) { const t = tally(s.id, D); aoa.push([s.no, s.name, ...D.map(d => cell(d, s)), t.y, t.i, t.g]); }
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{ wch: 6 }, { wch: 24 }, ...D.map(() => ({ wch: 6 })), { wch: 5 }, { wch: 6 }, { wch: 5 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Yoklama');
  XLSX.writeFile(wb, `yoklama-${cls().name.replace(/[\\/:*?"<>|\s]+/g, '-')}-${S.ym}.xlsx`);
};

$('#btnPrintSet').onclick = () => {
  if (!cls()?.students.length) return OA.toast('Önce sınıf seçin');
  const wrap = document.createElement('div');
  wrap.className = 'modal-back no-print';
  wrap.innerHTML = `
    <div class="modal">
      <div class="modal-hero"><div class="modal-emoji">🖨️</div><div><div class="eyebrow">Yazdır</div><h2>Aylık yoklama çizelgesi</h2></div></div>
      <div class="stack">
        <div class="checks"><label><input type="radio" name="pm" value="full" ${S.printBlank ? '' : 'checked'}> İşaretlerle birlikte</label><label><input type="radio" name="pm" value="blank" ${S.printBlank ? 'checked' : ''}> Boş çizelge (elle doldurmak için)</label></div>
      </div>
      <div class="modal-foot" style="margin-top:16px"><button class="btn" data-no>Vazgeç</button><button class="btn primary" data-ok>🖨️ Yazdır</button></div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('[data-no]').onclick = () => wrap.remove();
  wrap.querySelector('[data-ok]').onclick = () => {
    S.printBlank = wrap.querySelector('input[name=pm]:checked').value === 'blank'; save(); wrap.remove();
    const { D, studs, cell } = sheetRows(S.printBlank);
    const [y, m] = S.ym.split('-').map(Number);
    OA.renderPaper(null, `
      <div class="paper land">
        <div class="p-head">${S.okul ? `<div class="o">${esc(S.okul)}</div>` : ''}<h1>Aylık Yoklama Çizelgesi</h1>
          <div class="p-meta"><span>Sınıf: <b>${esc(cls().name)}</b></span><span>Ay: <b>${MONTHS[m - 1]} ${y}</b></span>${S.ogretmen ? `<span>Sınıf öğretmeni: <b>${esc(S.ogretmen)}</b></span>` : ''}</div></div>
        <table class="p-tbl"><colgroup><col style="width:34px"><col style="width:150px">${D.map(() => '<col>').join('')}${S.printBlank ? '' : '<col style="width:30px"><col style="width:30px"><col style="width:30px">'}</colgroup>
          <thead><tr><th>No</th><th>Ad Soyad</th>${D.map(d => `<th class="${S.holidays[d.iso] ? 'h' : ''}">${d.day}<br>${WD[d.wd]}</th>`).join('')}${S.printBlank ? '' : '<th>Yok</th><th>İzin</th><th>Geç</th>'}</tr></thead>
          <tbody>${studs.map(s => { const t = tally(s.id, D); return `<tr><td>${esc(s.no)}</td><td class="n">${esc(s.name)}</td>${D.map(d => `<td class="${S.holidays[d.iso] ? 'h' : ''} ${cell(d, s) === '✗' ? 'y' : ''}">${cell(d, s)}</td>`).join('')}${S.printBlank ? '' : `<td>${t.y || ''}</td><td>${t.i || ''}</td><td>${t.g || ''}</td>`}</tr>`; }).join('')}</tbody>
        </table>
        <div class="p-foot">
          <div class="p-legend">✓ Var · ✗ Yok (özürsüz) · İ İzinli (özürlü) · G Geç · Gri sütunlar tatil günüdür.</div>
          <div class="p-sign"><div><div class="ln"></div>${esc(S.ogretmen) || '&nbsp;'}<br><small>Sınıf Öğretmeni</small></div></div>
        </div>
      </div>`, { orient: 'landscape', margin: '8mm' });
    window.print();
  };
};

render();
</script>
</body>
</html>
